<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>算数で宇宙旅行！</title>
  <!-- クラウド同期（Firebase / Firestore）— compat版でビルド不要 -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script>
    // キャッシュ対策：読み込みのたびに新しいクエリを付けて必ず最新を取得する。
    var __v = Date.now();
    document.write('<link rel="stylesheet" href="styles.css?v=' + __v + '">');
  </script>
</head>
<body>
  <main id="app"></main>
  <script>
    // スクリプトも同様に最新を取得（順序を保つため async=false で順番に追加）
    (function () {
      ["topics.js", "app.js"].forEach(function (src) {
        var el = document.createElement("script");
        el.src = src + "?v=" + __v;
        el.async = false;
        document.head.appendChild(el);
      });
    })();
  </script>
</body>
</html>
